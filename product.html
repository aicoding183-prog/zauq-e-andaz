<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details - Zauq-e-Andaz</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
#detailWrap{max-width:1200px;margin:20px auto;padding:0 15px;display:flex;gap:25px;flex-wrap:wrap}
.d-img{flex:1;min-width:300px;background:#fff;padding:12px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.d-img img{width:100%;border-radius:12px}
.d-info{flex:1;min-width:300px;padding-top:10px}
.price{font-size:28px;font-weight:700;margin:12px 0}
.price .old{font-size:16px;color:#999;text-decoration:line-through;margin-left:8px}
.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btns button{padding:13px 20px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-family:Poppins}
.b1{background:#111;color:#fff} .b2{background:#25D366;color:#fff}
#related{max-width:1200px;margin:40px auto;padding:0 15px}
.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;margin-top:15px}
</style>
</head>
<body>
<div class="top-bar"><div class="container"><div class="top-left"><i class="fa-solid fa-truck"></i> Free delivery above Rs.1500</div><div class="top-right"><i class="fa-solid fa-phone"></i> 0311-2656159</div></div></div>
<header><div class="container header"><div class="logo"><a href="index.html"><img src="images/logo.png"></a></div><div class="brand"><h1>Zauq-e-Andaz</h1><p>Fashion Accessories</p></div><div class="header-actions"><a href="index.html" style="text-decoration:none"><div class="icon-pill">Home</div></a><div class="cart"><i class="fa-solid fa-cart-shopping"></i><span>0</span></div></div></div></header>

<div style="max-width:1200px;margin:15px auto;padding:0 15px"><a href="index.html" style="text-decoration:none;color:#111;font-weight:500">← Back to Shop</a></div>
<div id="detailWrap">Loading product...</div>
<div id="related"></div>

<!-- Cart Sidebar (same as index) -->
<div id="cartOverlay" class="cart-overlay"></div>
<div id="cartSidebar" class="cart-sidebar"><div class="cart-header"><h3>Your Cart</h3><span id="closeCart">✕</span></div><div id="cartItems"></div><div class="cart-footer"><p>Subtotal: <span id="cartSubtotal">Rs.0</span></p><p><b>Total: <span id="cartTotal">Rs.0</span></b></p><button onclick="orderCartWhatsApp()" style="width:100%;background:#25D366;color:#fff;border:none;padding:12px;border-radius:10px;margin-top:10px;font-weight:600">Checkout on WhatsApp</button></div></div>
<div id="toast"></div>

<script src="products.js"></script><script src="script.js"></script>
<script>
const urlId = new URLSearchParams(window.location.search).get('id');
const p = products.find(x => x.id == urlId);
const w = document.getElementById('detailWrap');
const r = document.getElementById('related');
if(p){
  document.title = p.name + ' - Zauq-e-Andaz';
  w.innerHTML = `<div class="d-img"><img src="${p.image}"></div><div class="d-info"><span style="background:#000;color:#fff;padding:4px 12px;border-radius:20px;font-size:11px">${p.tag}</span><h1 style="margin:10px 0 5px">${p.name}</h1><p style="color:#666;font-size:14px;line-height:1.6">${p.desc}</p><div class="price">Rs.${p.price} <span class="old">Rs.${p.oldPrice}</span></div><p style="font-size:14px"><b>Category:</b> ${p.category}</p><div class="btns"><button class="b1" onclick="addToCart(${p.id})">ADD TO CART</button><a href="https://wa.me/923112656159?text=Salam! Mujhe ye chahiye: ${encodeURIComponent(p.name)} Rs.${p.price} - ${location.href}" target="_blank"><button class="b2">ORDER ON WHATSAPP</button></a></div></div>`;
  // related
  const rel = products.filter(x=>x.category==p.category && x.id!=p.id).slice(0,4);
  if(rel.length){ r.innerHTML = `<h3>You May Also Like</h3><div class="related-grid">${rel.map(x=>`<div onclick="location.href='product.html?id=${x.id}'" style="background:#fff;padding:10px;border-radius:12px;cursor:pointer"><img src="${x.image}" style="width:100%;border-radius:8px"><p style="font-size:13px;margin-top:6px;font-weight:500">${x.name}</p><p style="font-weight:700">Rs.${x.price}</p></div>`).join('')}</div>` }
} else { w.innerHTML = '<h2>Product nahi mila, <a href="index.html">wapas jayen</a></h2>'; }
</script>
</body>
</html>
