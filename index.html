* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body { background: #f5f5f5; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 12px; }
a { text-decoration: none; color: inherit; }

/* DESKTOP CSS YAHAN LIKHO YA RAKH DO */
.top-bar { background: #000; color: #fff; padding: 8px 0; font-size: 12px; }
.top-bar .container { display: flex; justify-content: space-between; }
header { background: #fff; }

.logo img { width: 50px; }
.brand h1 { font-size: 22px; }

.cart { position: relative; background: #f5f5f5; padding: 12px; border-radius: 50%; cursor: pointer; }
.cart span { position: absolute; top: -5px; right: -5px; background: #ffcc00; color: #000; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; display: flex; align-items: center; justify-content: center; }
nav { background: #fff; padding: 10px 0; border-top: 1px solid #eee; }

.offer-badge { background: #ffcc00; padding: 5px 10px; border-radius: 20px; font-size: 12px; margin-left: auto; }

.category-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; }
.product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
.product-card { background: #fff; border-radius: 8px; overflow: hidden; }
