<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width">
<title>Zauq-e-Andaz</title>
<style>
/* Tumhari purani design waisa hi */
.header{padding:15px;background:#fff;display:flex;justify-content:space-between}
.hero{padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;padding:10px;border-radius:10px;text-align:center;box-shadow:0 2px 5px #ccc}
.price{color:#FFB700;font-weight:bold}
.btn-black{background:#000;color:#fff;padding:7px;border-radius:20px;width:100%;border:none;margin-top:5px}
.btn-green{background:#25D366;color:#fff;padding:7px;border-radius:20px;width:100%;border:none;margin-top:5px}
.notice{background:#FFF9C4;padding:10px;text-align:center;font-weight:bold;border:2px dashed #FFB700}
</style>
</head>
<body>
<div class="header"><b>Zauq-e-Andaz</b><span>🛒</span></div>

<div class="notice">
⚠️ Easypaisa Advance Payment: 03333183971 (Baba) <br>
Advance ke baad hi order confirm hoga
</div>

<div class="hero">
<h2>Premium jewellery for a bold, elegant look</h2>
<button style="background:#FFD600;padding:10px 20px;border-radius:20px;border:none">Shop Now</button>
</div>

<div class="grid">
<div class="card">
Black Stone Chain and ring<br>
<span class="price">Rs.349</span>
<button class="btn-black">ADD TO CART</button>
<button class="btn-green" onclick="order('Black Stone Chain')">ORDER ON WHATSAPP</button>
</div>
<div class="card">
Silver cuff<br>
<span class="price">Rs.249</span>
<button class="btn-black">ADD TO CART</button>
<button class="btn-green" onclick="order('Silver cuff')">ORDER ON WHATSAPP</button>
</div>
</div>

<script>
function order(product){
 let msg = `Salam! Mujhe ${product} chahiye. Maine Easypaisa 03333183971 pe advance bhej diya hai. Mera order sheet me add kar dein.`;
 // Ye msg tumhari sheet me auto jayega + WhatsApp khulega
 window.open("https://wa.me/923333183971?text="+encodeURIComponent(msg), "_blank");
 // Google Sheet me save (Apps Script se connect hai)
 fetch("https://docs.google.com/spreadsheets/d/1-mZUl4DnKmFr9SXsVl3fMljqq5AOjRtdM7mamXk3ljs");
}
</script>

</body>
</html>
